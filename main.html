<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Mundo 360º em A-Frame</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <style>
      #sofa-hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9;
        padding: 10px 16px;
        border-radius: 8px;
        background: #35291fe6;
        color: #fff6e9;
        font: 15px system-ui, sans-serif;
        pointer-events: none;
      }
      #stand-up {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 12px 20px;
        border: 1px solid #bca58b;
        border-radius: 8px;
        background: #35291f;
        color: #fff6e9;
        font: 16px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
    
    <!-- SCRIPT DE BOUNDS (Limites do Jogador) -->
    <script>
      // Textura de estuque gerada localmente, sem imagens ou serviços externos.
      let plasterImages;
      AFRAME.registerComponent('plaster', {
        schema: {repeat: {type: 'vec2', default: {x: 12, y: 5.5}}},
        init: function () {
          if (!plasterImages) {
            const size = 128;
            const height = new Float32Array(size * size);
            let seed = 73;
            for (let i = 0; i < height.length; i++) {
              seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
              height[i] = seed / 4294967296;
            }
            const color = document.createElement('canvas');
            const normal = document.createElement('canvas');
            color.width = color.height = normal.width = normal.height = size;
            const colorContext = color.getContext('2d');
            const normalContext = normal.getContext('2d');
            const colorData = colorContext.createImageData(size, size);
            const normalData = normalContext.createImageData(size, size);
            const sample = (x, y) => height[((y + size) % size) * size + (x + size) % size];
            for (let y = 0; y < size; y++) {
              for (let x = 0; x < size; x++) {
                const i = (y * size + x) * 4;
                const shade = 249 + Math.round(sample(x, y) * 6);
                colorData.data.set([shade, shade, shade, 255], i);
                const nx = (sample(x - 1, y) - sample(x + 1, y)) * 0.3;
                const ny = (sample(x, y - 1) - sample(x, y + 1)) * 0.3;
                const length = Math.hypot(nx, ny, 1);
                normalData.data.set([
                  Math.round((nx / length + 1) * 127.5),
                  Math.round((ny / length + 1) * 127.5),
                  Math.round((1 / length + 1) * 127.5), 255
                ], i);
              }
            }
            colorContext.putImageData(colorData, 0, 0);
            normalContext.putImageData(normalData, 0, 0);
            plasterImages = {color, normal};
          }
          this.colorMap = new THREE.CanvasTexture(plasterImages.color);
          this.colorMap.colorSpace = THREE.SRGBColorSpace;
          this.normalMap = new THREE.CanvasTexture(plasterImages.normal);
          for (const texture of [this.colorMap, this.normalMap]) {
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(this.data.repeat.x, this.data.repeat.y);
          }
          this.applyMaterial = () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) return;
            mesh.material.map = this.colorMap;
            mesh.material.normalMap = this.normalMap;
            mesh.material.normalScale.set(0.22, 0.22);
            mesh.material.needsUpdate = true;
          };
          this.el.addEventListener('object3dset', this.applyMaterial);
          this.el.addEventListener('materialtextureloaded', this.applyMaterial);
          this.applyMaterial();
        },
        remove: function () {
          this.el.removeEventListener('object3dset', this.applyMaterial);
          this.el.removeEventListener('materialtextureloaded', this.applyMaterial);
          this.colorMap.dispose();
          this.normalMap.dispose();
        }
      });

      AFRAME.registerComponent('furniture-collider', {
        init: function () {
          this.box = null;
          this.updateBounds = () => {
            const mesh = this.el.getObject3D('mesh');
            if (!mesh) {
              return;
            }
            mesh.updateWorldMatrix(true, true);
            this.box = new THREE.Box3().setFromObject(mesh);
          };
          this.el.addEventListener('model-loaded', this.updateBounds);
          this.updateBounds();
        },
        remove: function () {
          this.el.removeEventListener('model-loaded', this.updateBounds);
        }
      });

    </script>
    <script src="js/player-controls.js"></script>
    <script src="js/sofa-interaction.js"></script>
    <script src="js/tv-menu.js"></script>
    <script src="js/tv-buttons.js"></script>

  </head>
  
  <body>
    <div id="sofa-hint" role="status" hidden></div>
    <button id="stand-up" type="button" hidden>Levantar do sofá (E)</button>
    <a-scene shadow="type: pcfsoft" background="color: #513222">

      
      
      <!-- 1. Pré-carregar a imagem 360º nos assets -->
      <a-assets>
        <!-- Substitui "qwantani_dusk.jpg" pelo nome do teu ficheiro 360º -->
        <a-asset-item id="floor" src="assets/wooden_floor.glb"> </a-asset-item>
        <a-asset-item id="sofa" src="assets/sofa_web.glb"></a-asset-item>
        <a-asset-item id="tv-table" src="assets/wooden_tv_tablemedia_center_pbr.glb"></a-asset-item>
        <a-asset-item id="plant" src="assets/monstera_deliciosa_potted_mid-century_plant.glb"></a-asset-item>
        <a-asset-item id="carpet" src="assets/persian_malayer_carpet.glb"></a-asset-item>
        <a-asset-item id="bookshelf" src="assets/bookshelf_pbr.glb"></a-asset-item>
        <a-asset-item id="floor-lamp" src="assets/a_floor_lamp.glb"></a-asset-item>
        <video id="tv-player" preload="metadata" playsinline webkit-playsinline></video>
      </a-assets>


      <!-- Chão -->
      <!-- Base escura para esconder as pequenas aberturas entre as tábuas. -->
      <a-plane position="10 -0.3 -11.9" rotation="-90 0 0" width="20" height="23.8"
        material="shader: flat; color: #513222" shadow="cast: false; receive: false"></a-plane>
      <a-entity
        gltf-model="#floor"
        shadow="cast: false; receive: true"
        position="0 0 0"
        rotation="-90 0 0"
        scale="3.35 4 4">
      </a-entity>
    

      <!-- Móvel da TV junto à parede mais curta, em X = 0 -->
      <a-entity
        gltf-model="#tv-table"
        shadow="cast: true; receive: true"
        furniture-collider
        position="1.5 -0.027 -12.058"
        rotation="0 90 0"
        scale="5 5 5">
      </a-entity>

      <!-- Ecrã fixo na parede, centrado por cima do móvel -->
      <a-entity id="tv-screen" position="0.12 6.5 -11.9" rotation="0 90 0">
        <a-box width="8.4" height="4.9" depth="0.16" color="#171717"></a-box>
        <a-plane
          position="0 0 0.14"
          width="8"
          height="4.5"
          material="shader: flat; color: #080c12"
          shadow="cast: false; receive: false">
        </a-plane>

        <a-entity
          id="tv-menu"
          tv-menu
          position="0 0 0.22"
          visible="false">

           <a-entity
            position="-5 0.65 0"
            tv-button="action: previous; label: Anterior">
          </a-entity>

          <a-entity
            position="-5 -0.65 0"
            tv-button="action: back; label: Voltar">
          </a-entity>

          <!-- Direita -->
          <a-entity
            position="5 0.65 0"
            tv-button="action: next; label: Seguinte">
          </a-entity>

          <a-entity
            position="5 -0.65 0"
            tv-button="action: open; label: Abrir">
          </a-entity>
        </a-entity>

        <a-text
          id="tv-message"
          value="Chegue perto do sofa e clique para se sentar"
          position="0 0 0.20"
          width="7"
          wrap-count="30"
          align="center"
          anchor="center"
          baseline="center"
          color="#ffffff"
          visible="true">
        </a-text>

      </a-entity>



      <!-- Sofá em frente ao móvel, virado para o ecrã -->
      <a-entity
        gltf-model="#sofa"
        class="clickable"
        sit-on-click
        shadow="cast: true; receive: true"
        furniture-collider
        position="12 -0.028 -11.9"
        rotation="0 -90 0"
        scale="0.008 0.008 0.008">
      </a-entity>


      <!-- Tapete na zona de estar; a sua espessura permite caminhar por cima. -->
      <a-entity
        gltf-model="#carpet"
        shadow="cast: false; receive: true"
        furniture-collider
        position="8 0.04 -11.9"
        rotation="0 90 0"
        scale="6.5 1 10">
      </a-entity>

      <!-- Planta no canto, ao lado da zona da TV. -->
      <a-entity
        gltf-model="#plant"
        shadow="cast: true; receive: true"
        furniture-collider
        position="1.6 0.788 -2"
        rotation="0 90 0"
        scale="6 6 6">
      </a-entity>

      <!-- Candeeiro ao lado do sofá. -->
      <a-entity
        gltf-model="#floor-lamp"
        shadow="cast: true; receive: true"
        furniture-collider
        position="12.2 -0.0075 -8"
        scale="0.9 0.9 0.9">
        
        <!-- Coordenadas locais da lâmpada, acompanhando o modelo e a escala. -->
        <a-entity id="floor-lamp-target" position="0 0 -2.061"></a-entity>
        <a-entity position="0 7.94 -2.061"
          light="type: spot; 
          color: #ffd29c; 
          intensity: 1.2; 
          distance: 16; 
          decay: 1; 
          angle: 48; 
          penumbra: 0.65;  
          target: #floor-lamp-target; 
          castShadow: false">
        </a-entity>
      </a-entity>

      <!-- Estante junto à parede comprida, virada para o interior. -->
      <a-entity
        gltf-model="#bookshelf"
        shadow="cast: true; receive: true"
        furniture-collider
        position="2.5 -0.005 -23.8"
        rotation="0 -90 0"
        scale="2 2 2">
      </a-entity>

      <!-- Sala encurtada: X de 0 a 20, deixando passagem atrás do sofá. -->
      <!-- Paredes creme, com estuque mate e relevo subtil. -->
      <a-plane position="10 5.5 -23.8" width="20" height="11"
        material="color: #eee5d4; roughness: 0.92; metalness: 0" plaster="repeat: 10 5.5"
        shadow="cast: false; receive: true" static-body></a-plane>

      <a-plane position="10 5.5 0" rotation="0 180 0" width="20" height="11"
        material="color: #eee5d4; roughness: 0.92; metalness: 0" plaster="repeat: 10 5.5"
        shadow="cast: false; receive: true" static-body></a-plane>

      <a-plane position="0 5.5 -11.9" rotation="0 90 0" width="23.8" height="11"
        material="color: #eee5d4; roughness: 0.92; metalness: 0" plaster="repeat: 11.9 5.5"
        shadow="cast: false; receive: true" static-body></a-plane>
        
      <a-plane position="17 5.5 -11.9" rotation="0 -90 0" width="23.8" height="11"
        material="color: #eee5d4; roughness: 0.92; metalness: 0" plaster="repeat: 11.9 5.5"
        shadow="cast: false; receive: true" static-body></a-plane>
     

      <!-- Teto -->
      <a-plane position="10 11 -11.9" rotation="90 0 0" width="20" height="23.8"
        material="color: #faf6ee; roughness: 1; metalness: 0" static-body></a-plane>

      

      <!-- Luz ambiente suave e plafon visível no teto. -->
      <a-light type="ambient" color="#fff3e3" intensity="0.45"></a-light>
      <a-cylinder position="8.5 10.88 -11.9" radius="1.1" height="0.18"
        material="color: #e3d9c9; roughness: 0.8; metalness: 0"></a-cylinder>
      <a-circle position="8.5 10.78 -11.9" rotation="90 0 0" radius="1"
        material="shader: flat; color: #fff1d8"></a-circle>
      <a-entity id="room-light-target" position="8.5 0 -11.9"></a-entity>
      <a-entity position="8.5 10.7 -11.9"
        light="type: spot; 
        color: #fff0d9; 
        intensity: 1.4; 
        distance: 45; 
        decay: 1; 
        angle: 75; 
        penumbra: 0.6; 
        target: #room-light-target; 
        castShadow: true; 
        shadowMapWidth: 2048; 
        shadowMapHeight: 2048; 
        shadowCameraNear: 0.5; 
        shadowCameraFar: 45; 
        shadowBias: -0.0003; 
        shadowNormalBias: 0.04">
      </a-entity>


      <!-- Câmara para o utilizador navegar na sala -->
      <!-- Limites de visão ajustados à sala para melhorar a precisão de profundidade. -->
      <!-- O rig desloca o jogador e os comandos sem contrariar o tracking VR. -->
      <a-entity id="player-rig" position="8 0 -11.9" player-controls>
        <a-camera id="player-camera" position="0 5.6 0" rotation="0 90 0" near="0.1" far="80"
          wasd-controls="enabled: false" cursor="rayOrigin: mouse"
          raycaster="objects: .clickable; far: 20"></a-camera>
        <a-entity id="left-controller" laser-controls="hand: left"
          raycaster="objects: .clickable; far: 20; lineColor: #e4bb78"></a-entity>
        <a-entity id="right-controller" laser-controls="hand: right"
          raycaster="objects: .clickable; far: 20; lineColor: #e4bb78"></a-entity>
      </a-entity>



    </a-scene>
  </body>
</html>
