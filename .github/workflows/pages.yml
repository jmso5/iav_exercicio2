name: Publicar projeto VR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Preparar site
        run: |
          mkdir -p public
          cp main.html public/index.html
          cp -r js assets images videos public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4